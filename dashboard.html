<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pappuchan - Live AFK Bot Console</title>
  <link rel="icon" href="https://mc-heads.net/avatar/pappuchan/64" type="image/png">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --yellow: #f59e0b;
      --red: #ef4444;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand img {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      image-rendering: pixelated;
    }
    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }
    .brand-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .stats-bar {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .badge.offline {
      background: rgba(239, 68, 68, 0.15);
      color: var(--red);
      border-color: rgba(239, 68, 68, 0.3);
    }
    .badge.connecting {
      background: rgba(245, 158, 11, 0.15);
      color: var(--yellow);
      border-color: rgba(245, 158, 11, 0.3);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    .stat-pill {
      font-size: 0.8rem;
      color: var(--text-muted);
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .stat-pill strong {
      color: #fff;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      overflow: hidden;
    }
    .terminal-container {
      flex: 1;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }
    .terminal-header {
      background: #111827;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f2937;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .terminal-logs {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .log-line {
      display: flex;
      gap: 10px;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .log-time {
      color: #64748b;
      font-size: 0.75rem;
      user-select: none;
      min-width: 65px;
    }
    .tag {
      font-weight: 700;
      font-size: 0.75rem;
      padding: 1px 6px;
      border-radius: 4px;
      user-select: none;
      height: fit-content;
    }
    .tag-chat { background: #1e293b; color: #94a3b8; }
    .tag-joke { background: rgba(245, 158, 11, 0.2); color: var(--yellow); }
    .tag-promo { background: rgba(239, 68, 68, 0.2); color: var(--red); }
    .tag-ai { background: rgba(168, 85, 247, 0.2); color: var(--purple); }
    .tag-system { background: rgba(56, 189, 248, 0.2); color: var(--accent); }
    .log-msg {
      flex: 1;
      color: #e2e8f0;
    }
    .log-msg.highlight-ai {
      color: #d8b4fe;
      font-weight: 600;
    }
    .log-msg.highlight-joke {
      color: #fde047;
    }
    .log-msg.highlight-promo {
      color: #f87171;
    }
    .input-bar {
      display: flex;
      gap: 8px;
    }
    .input-bar input {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    .input-bar input:focus {
      border-color: var(--accent);
    }
    .input-bar button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .input-bar button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="https://mc-heads.net/avatar/pappuchan/64" alt="pappuchan avatar">
      <div>
        <div class="brand-title">pappuchan ✦ AFK Bot</div>
        <div class="brand-subtitle">Server: <strong>play.ashsmp.in</strong> (Lifesteal)</div>
      </div>
    </div>
    <div class="stats-bar">
      <div id="statusBadge" class="badge">
        <span class="dot"></span>
        <span id="statusText">Connecting...</span>
      </div>
      <div class="stat-pill">Jokes: <strong id="jokesCount">0/200</strong></div>
      <div class="stat-pill">AI Replies: <strong id="aiCount">0</strong></div>
      <div class="stat-pill">Uptime: <strong id="uptimeText">0s</strong></div>
    </div>
  </header>

  <main>
    <div class="terminal-container">
      <div class="terminal-header">
        <span>● LIVE SERVER CHAT &amp; LOGS</span>
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="checkbox" id="autoScroll" checked> Auto-Scroll
        </label>
      </div>
      <div id="logs" class="terminal-logs">
        <div class="log-line">
          <span class="log-time">--:--:--</span>
          <span class="tag tag-system">SYSTEM</span>
          <span class="log-msg">Connecting to live console stream...</span>
        </div>
      </div>
    </div>

    <form id="chatForm" class="input-bar">
      <input type="text" id="chatInput" placeholder="Type a chat message or command (e.g. /spawn, hello guys)..." autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </main>

  <script>
    const logsEl = document.getElementById('logs');
    const autoScrollEl = document.getElementById('autoScroll');
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const jokesCountEl = document.getElementById('jokesCount');
    const aiCountEl = document.getElementById('aiCount');
    const uptimeTextEl = document.getElementById('uptimeText');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');

    let lastLogId = 0;

    function formatUptime(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      if (h > 0) return `${h}h ${m}m ${s}s`;
      if (m > 0) return `${m}m ${s}s`;
      return `${s}s`;
    }

    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        if (!res.ok) return;
        const data = await res.json();

        // Update status badge
        if (data.connected && data.hasWarpedAfk) {
          statusBadge.className = 'badge';
          statusText.textContent = 'ONLINE (AFK ZONE)';
        } else if (data.connected) {
          statusBadge.className = 'badge connecting';
          statusText.textContent = data.status || 'CONNECTED';
        } else {
          statusBadge.className = 'badge offline';
          statusText.textContent = data.status || 'OFFLINE';
        }

        jokesCountEl.textContent = `${data.jokesSent || 0}/${data.totalJokesAvailable || 200}`;
        aiCountEl.textContent = data.aiRepliesSent || 0;
        uptimeTextEl.textContent = formatUptime(data.uptimeSeconds || 0);

        if (data.logs && data.logs.length > 0) {
          const latest = data.logs[data.logs.length - 1];
          if (latest && latest.id !== lastLogId) {
            lastLogId = latest.id;
            renderLogs(data.logs);
          }
        }
      } catch (e) {
        statusBadge.className = 'badge offline';
        statusText.textContent = 'DISCONNECTED';
      }
    }

    function renderLogs(logs) {
      logsEl.innerHTML = '';
      logs.forEach(item => {
        const line = document.createElement('div');
        line.className = 'log-line';

        let tagClass = 'tag-chat';
        let highlightClass = '';
        if (item.type === 'JOKE') { tagClass = 'tag-joke'; highlightClass = 'highlight-joke'; }
        else if (item.type === 'PROMO') { tagClass = 'tag-promo'; highlightClass = 'highlight-promo'; }
        else if (item.type === 'AI') { tagClass = 'tag-ai'; highlightClass = 'highlight-ai'; }
        else if (item.type === 'SYSTEM') { tagClass = 'tag-system'; }

        line.innerHTML = `
          <span class="log-time">${item.time}</span>
          <span class="tag ${tagClass}">${item.type}</span>
          <span class="log-msg ${highlightClass}">${escapeHtml(item.text)}</span>
        `;
        logsEl.appendChild(line);
      });

      if (autoScrollEl.checked) {
        logsEl.scrollTop = logsEl.scrollHeight;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;
      chatInput.value = '';

      try {
        await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
      } catch (err) {
        alert('Failed to send message: ' + err.message);
      }
    });

    setInterval(fetchStatus, 2000);
    fetchStatus();
  </script>
</body>
</html>
